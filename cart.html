<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — MechMurph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">MECHMURPH</a>
      <nav class="nav" id="nav">
        <a href="shop.html">Shop</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a class="cart-link current" href="cart.html">Cart (1)</a>
      </nav>
      <a class="btn-book" href="appointments.html">Book now</a>
      <button class="menu-toggle" data-menu-toggle aria-label="Menu" aria-expanded="false">&#9776;</button>
    </div>
  </header>

  <main class="wrap section">
    <h1 style="color:var(--green);">Shopping cart</h1>

    <div class="cart-item">
      <div class="photo" role="img" aria-label="Product photo placeholder">Photo</div>
      <div>
        <strong>Professionally Refurbished Toro Self-Propelled Lawn Mower</strong>
        <div class="qty">Qty 1 · Limit 1 per order</div>
      </div>
      <div class="line-price">$250.00</div>
    </div>

    <div class="cart-totals">
      <span class="label">Subtotal</span>
      <span class="amount">$250.00</span>
    </div>

    <!-- Checkout is a placeholder. In a real deployment this button links to
         your payment processor's hosted checkout (Stripe / Square / etc.). -->
    <div class="cart-actions">
      <a class="btn btn-dark" href="#">Checkout</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <div class="footer-brand">MechMurph</div>
        <p>Small-engine repair · San Antonio, TX</p>
      </div>
      <div class="footer-contact">
        <a href="mailto:info@mechmurph.com">info@mechmurph.com</a><br />
        <span class="small">[210-XXX-XXXX] &middot; Walk-ins welcome</span>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
